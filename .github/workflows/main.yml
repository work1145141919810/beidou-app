name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install --upgrade buildozer cython
          pip3 install --upgrade python-for-android
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Prepare receiver build
        run: |
          sed -i 's/^title = .*/title = 北斗接收端/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = beidoureceiver/' buildozer.spec
          sed -i 's/^main.py = .*/main.py = main_receiver.py/' buildozer.spec
          rm -rf .buildozer

      - name: Build receiver APK
        run: |
          buildozer android debug

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: beidou-receiver
          path: bin/*.apk
